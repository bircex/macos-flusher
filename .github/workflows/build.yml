name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - run: make test
      - run: make package ARCHS="arm64 x86_64"
      - run: test -x "dist/MacOS Flusher.app/Contents/MacOS/MacOSFlusher"
      - run: lipo "dist/MacOS Flusher.app/Contents/MacOS/MacOSFlusher" -verify_arch arm64 x86_64
      - run: cd dist && shasum -a 256 -c SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: MacOS-Flusher
          path: |
            dist/MacOS-Flusher.dmg
            dist/MacOS-Flusher.zip
            dist/SHA256SUMS
